[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamppy"
dynamic = ["version"]
description = "Genome-scale design of group-specific LAMP primer sets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Filipe Dezordi" }]
keywords = ["LAMP", "primer design", "bioinformatics", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["click>=8.1", "primer3-py>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
    "types-PyYAML",
    "black>=24.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-click>=6.0",
]

[project.urls]
Homepage = "https://github.com/dezordi/LAMPpy"
Documentation = "https://lamppy.readthedocs.io"
Changelog = "https://github.com/dezordi/LAMPpy/blob/master/CHANGELOG.md"
Issues = "https://github.com/dezordi/LAMPpy/issues"

[project.scripts]
lamppy = "lamppy.cli:main"

[tool.hatch.version]
path = "src/lamppy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lamppy"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.readthedocs.yaml",
    "/CLAUDE.md",
    "/Dockerfile",
    "/docs/images",
    "/legacy",
]

[tool.black]
line-length = 88
extend-exclude = "legacy/"
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "D"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "primer3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
